# Turns the .phnx files in this repo into a website on GitHub Pages, every time you push.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get Phnx
        run: xz -dc .phnx-bin/phnx-linux.xz > "$RUNNER_TEMP/phnx" && chmod +x "$RUNNER_TEMP/phnx"
      - name: Build
        run: $RUNNER_TEMP/phnx build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
